<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>DOCX 查看器</title>

<script src="mammoth.browser.min.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  :root{
    --bg:#eef1f4;
    --surface:#ffffff;
    --panel:#ffffff;
    --text:#1f2328;
    --muted:#697586;
    --border:#e1e5ea;
    --accent:#2563eb;
    --accent-soft:#eaf1ff;
    --shadow:0 1px 2px rgba(16,24,40,.05);
    --h-top:52px;
  }
  body.dark{
    --bg:#0f1115;
    --surface:#191c21;
    --panel:#15181c;
    --text:#e5e8ec;
    --muted:#98a2b3;
    --border:#282d35;
    --accent:#5b9dff;
    --accent-soft:#1c2533;
    --shadow:0 1px 2px rgba(0,0,0,.5);
  }

  html, body { height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
         "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow:hidden;
    -webkit-text-size-adjust:100%;
    transition:background .2s, color .2s;
  }

  .app{ height:100vh; height:100dvh; display:flex; flex-direction:column; }

  /* ================= 顶部工具栏 ================= */
  .topbar{
    position:relative;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    /* 不能再用 space-between：窄屏内容溢出时它会把左侧整组压成 0 宽，
       导致“打开 / 导入文件”被 overflow:hidden 裁掉。改为左对齐 +
       右侧 margin-left:auto，放不下时整条工具栏横向滚动。 */
    justify-content:flex-start;
    gap:8px;
    min-height:var(--h-top);
    padding:6px 8px;
    padding-top:calc(6px + env(safe-area-inset-top));
    background:var(--panel);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    overflow-y:hidden;
    scrollbar-width:none;
    z-index:20;
  }
  .topbar::-webkit-scrollbar{ display:none; }

  .tb-left, .tb-right{ display:flex; align-items:center; gap:3px; flex:0 0 auto; }
  /* 不压缩左侧，否则窄屏上“打开 / 导入文件”会被 toolbar 裁掉；
     超出宽度时由 .topbar 的横向滚动承接 */
  .tb-left{ flex:0 0 auto; min-width:0; overflow:visible; }
  .tb-right{ justify-content:flex-end; margin-left:auto; }

  .doc-title{
    font-size:13.5px;
    font-weight:600;
    padding:0 6px;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    height:34px;
    padding:0 10px;
    border:1px solid transparent;
    border-radius:8px;
    background:transparent;
    color:var(--text);
    font:inherit;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
    flex:0 0 auto;
    transition:background .15s, color .15s, border-color .15s, transform .05s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:hover{ background:var(--accent-soft); color:var(--accent); }
  .btn:active{ transform:scale(.96); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn.icon{ width:34px; padding:0; }
  .btn.active{ background:var(--accent-soft); color:var(--accent); }
  .btn.primary{ background:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent); color:#fff; filter:brightness(1.08); }

  .btn svg{
    width:17px; height:17px; flex:0 0 auto;
    stroke:currentColor; fill:none;
    stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;
  }

  .zoom-label{
    min-width:52px;
    font-variant-numeric:tabular-nums;
    font-size:13px;
    padding:0 6px;
  }

  .sep{ width:1px; height:20px; background:var(--border); margin:0 3px; flex:0 0 auto; }

  .progress{
    position:absolute; left:0; right:0; bottom:-1px; height:2px;
    pointer-events:none; overflow:hidden;
  }
  .progress i{
    display:block; height:100%; width:0;
    background:var(--accent); opacity:.7;
    transition:width .12s linear;
  }

  /* ================= 搜索栏 ================= */
  .searchbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 10px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
  }
  .searchbar input{
    flex:1 1 auto;
    min-width:0;
    height:32px;
    padding:0 10px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--bg);
    color:var(--text);
    font:inherit;
    font-size:13.5px;
    outline:none;
  }
  .searchbar input:focus{ border-color:var(--accent); background:var(--surface); }
  .search-count{
    font-size:12.5px;
    color:var(--muted);
    white-space:nowrap;
    min-width:46px;
    text-align:center;
    font-variant-numeric:tabular-nums;
  }

  /* ================= 分页导航条 ================= */
  .pager{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:5px 10px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    font-size:13px;
    color:var(--muted);
  }
  .pager input{
    width:54px;
    height:28px;
    text-align:center;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--bg);
    color:var(--text);
    font:inherit;
    font-size:13px;
    outline:none;
    -moz-appearance:textfield;
    font-variant-numeric:tabular-nums;
  }
  .pager input:focus{ border-color:var(--accent); }
  .pager input::-webkit-outer-spin-button,
  .pager input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

  /* ================= 主体 ================= */
  .body{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    position:relative;
    overflow:hidden;
  }

  /* ---------- 侧边目录 ---------- */
  .sidebar{
    flex:0 0 auto;
    width:0;
    overflow:hidden;
    background:var(--panel);
    border-right:1px solid var(--border);
    transition:width .18s ease;
    display:flex;
    flex-direction:column;
  }
  .sidebar.open{ width:270px; }
  .sidebar-inner{ width:270px; height:100%; display:flex; flex-direction:column; }
  .sidebar-head{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 8px 10px 14px;
    border-bottom:1px solid var(--border);
    font-size:13px;
    font-weight:600;
    color:var(--muted);
  }
  .toc{ flex:1 1 auto; overflow-y:auto; padding:8px 8px 24px; -webkit-overflow-scrolling:touch; }
  .toc-item{
    display:block;
    width:100%;
    text-align:left;
    border:none;
    background:transparent;
    color:var(--text);
    font:inherit;
    font-size:13.5px;
    line-height:1.45;
    padding:6px 8px;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .toc-item:hover{ background:var(--accent-soft); color:var(--accent); }
  .toc-item.lv2{ padding-left:22px; font-size:13px; }
  .toc-item.lv3{ padding-left:36px; font-size:12.5px; color:var(--muted); }
  .toc-item.lv4{ padding-left:50px; font-size:12.5px; color:var(--muted); }
  .toc-empty{ padding:20px 16px; color:var(--muted); font-size:13px; text-align:center; }

  .sidebar-mask{ display:none; }

  /* ---------- 视口 ---------- */
  .viewport{
    flex:1 1 auto;
    min-width:0;
    position:relative;
    overflow:auto;
    padding:16px;
    background:var(--bg);
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .viewport.pan-mode, .viewport.pan-mode *{ cursor:grab !important; }
  body.panning, body.panning *{ cursor:grabbing !important; user-select:none !important; -webkit-user-select:none !important; }

  .sizer{ position:relative; margin:0 auto; overflow:hidden; }
  .content{ position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }

  /* ---------- 纸张 ---------- */
  .paper{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:44px 48px 52px;
    font-size:16px;
    line-height:1.8;
    overflow-wrap:break-word;
    word-break:break-word;
    box-shadow:var(--shadow);
  }
  .page{ margin-bottom:18px; }
  .page:last-child{ margin-bottom:0; }
  .page-badge{
    margin-top:26px;
    padding-top:12px;
    border-top:1px dashed var(--border);
    text-align:center;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.5px;
  }

  /* ================= 文档内容排版 ================= */
  .docx > *:first-child{ margin-top:0 !important; }
  .docx h1, .docx h2, .docx h3, .docx h4, .docx h5, .docx h6{
    font-weight:600;
    line-height:1.35;
    margin:1.4em 0 .6em;
  }
  .docx h1{ font-size:1.7em; }
  .docx h2{ font-size:1.4em; }
  .docx h3{ font-size:1.2em; }
  .docx h4{ font-size:1.05em; }
  .docx h5, .docx h6{ font-size:1em; }
  .docx p{ margin:0 0 .9em; }
  .docx ul, .docx ol{ margin:0 0 .9em; padding-left:1.6em; }
  .docx li{ margin:.25em 0; }
  .docx a{ color:var(--accent); text-decoration:none; }
  .docx a:hover{ text-decoration:underline; }
  .docx img{ max-width:100%; height:auto; border-radius:6px; }
  .docx blockquote{
    margin:0 0 1em;
    padding:.2em 1em;
    border-left:4px solid #d8dee6;
    color:#57606a;
  }
  .docx code{
    background:#f2f4f7;
    padding:.15em .4em;
    border-radius:5px;
    font-size:.9em;
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .docx pre{
    background:#f6f8fa;
    padding:12px 14px;
    border-radius:8px;
    overflow:auto;
  }
  .docx pre code{ background:none; padding:0; }
  .docx hr{ border:none; border-top:1px solid var(--border); margin:1.6em 0; }

  .docx .table-wrap{
    max-width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    margin:0 0 1em;
  }
  .docx table{ border-collapse:collapse; width:100%; font-size:.95em; }
  .docx th, .docx td{
    border:1px solid #d8dee6;
    padding:7px 10px;
    text-align:left;
    vertical-align:top;
  }
  .docx th{ background:#f6f8fa; font-weight:600; }

  .docx .doc-title{ font-size:1.9em; text-align:center; margin:0 0 .6em; }
  .docx .doc-subtitle{ text-align:center; color:var(--muted); margin:0 0 1.6em; }

  /* 深色文档 */
  body.dark .docx code,
  body.dark .docx pre{ background:#232830; }
  body.dark .docx th{ background:#232830; }
  body.dark .docx th,
  body.dark .docx td{ border-color:#333a44; }
  body.dark .docx blockquote{ border-left-color:#333a44; color:#a6b0bd; }

  /* 搜索高亮 */
  mark.hl{ background:#ffe58a; color:inherit; padding:0; border-radius:2px; }
  mark.hl.current{ background:#ff9f43; color:#fff; }
  body.dark mark.hl{ background:#6b5a00; color:#fff2b8; }
  body.dark mark.hl.current{ background:#ff9f43; color:#1a1d23; }

  /* ================= 空状态 ================= */
  .empty{
    position:absolute;
    inset:0;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:24px;
    overflow:auto;
    z-index:1;
  }
  .dropzone{
    width:min(540px, 100%);
    min-height:260px;
    margin:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-align:center;
    padding:30px 22px;
    background:var(--surface);
    border:2px dashed #cfd6df;
    border-radius:18px;
    cursor:pointer;
    outline:none;
    transition:border-color .18s, background .18s, transform .18s;
  }
  body.dark .dropzone{ border-color:#333a44; }
  .dropzone:hover, .dropzone:focus-visible{ border-color:var(--accent); background:var(--accent-soft); }
  .dropzone:active{ transform:scale(.995); }
  .dz-icon{ color:var(--accent); opacity:.9; }
  .dz-title{ margin:0; font-size:16px; font-weight:600; }
  .dz-sub{ margin:0; font-size:13px; color:var(--muted); line-height:1.7; }

  /* ================= 浮动按钮 ================= */
  .to-top{
    position:absolute;
    right:18px;
    bottom:calc(18px + env(safe-area-inset-bottom));
    width:42px; height:42px;
    border-radius:50%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.14);
    opacity:0;
    pointer-events:none;
    transform:translateY(10px);
    transition:opacity .2s, transform .2s;
    z-index:30;
  }
  .to-top.show{ opacity:1; pointer-events:auto; transform:none; }
  .to-top svg{ width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  /* ================= 拖拽 / 加载 / 提示 ================= */
  .drag-overlay{
    position:fixed; inset:0; display:none;
    align-items:center; justify-content:center;
    background:rgba(37,99,235,.10);
    z-index:100; pointer-events:none;
    font-weight:600; color:var(--accent); font-size:15px;
  }
  .drag-overlay.show{ display:flex; }
  .drag-overlay > div{
    padding:20px 28px;
    border-radius:14px;
    background:var(--panel);
    border:2px dashed var(--accent);
    box-shadow:0 10px 30px rgba(0,0,0,.15);
  }

  .loading{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
    z-index:90; font-size:14px; color:var(--muted);
  }
  body.dark .loading{ background:rgba(15,17,21,.72); }
  .spinner{
    width:20px; height:20px; border-radius:50%;
    border:2.5px solid #d7dee8; border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  body.dark .spinner{ border-color:#333a44; border-top-color:var(--accent); }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .toast{
    position:fixed;
    left:50%;
    bottom:calc(26px + env(safe-area-inset-bottom));
    transform:translate(-50%, 12px);
    background:rgba(31,35,40,.93);
    color:#fff;
    font-size:13.5px;
    line-height:1.5;
    padding:10px 16px;
    border-radius:10px;
    max-width:min(90vw, 440px);
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:120;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* ================= 移动端 ================= */
  @media (max-width: 820px){
    .sidebar{
      position:absolute;
      top:0; bottom:0; left:0;
      width:270px;
      z-index:45;
      transform:translateX(-100%);
      transition:transform .22s ease;
      box-shadow:0 0 40px rgba(0,0,0,.2);
    }
    .sidebar.open{ width:270px; transform:translateX(0); }
    .sidebar-mask{
      display:block;
      position:absolute; inset:0;
      background:rgba(0,0,0,.35);
      z-index:44;
      opacity:0;
      pointer-events:none;
      transition:opacity .2s;
    }
    .sidebar-mask.show{ opacity:1; pointer-events:auto; }
  }

  @media (max-width: 640px){
    .viewport{ padding:10px; }
    .paper{ padding:20px 16px 26px; font-size:15px; line-height:1.75; border-radius:6px; }
    .page{ margin-bottom:12px; }
    .btn span.btn-text{ display:none; }
    .btn{ height:32px; }
    .btn.icon{ width:32px; }
    .doc-title{ font-size:12.5px; }
    .dropzone{ min-height:220px; padding:24px 18px; border-radius:14px; }
    .dz-title{ font-size:15px; }
    .to-top{ right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); width:38px; height:38px; }
  }

  /* ================= 打印 ================= */
  @media print{
    .topbar, .searchbar, .pager, .sidebar, .sidebar-mask, .to-top,
    .drag-overlay, .toast, .loading, .empty{ display:none !important; }
    body{ background:#fff; overflow:visible; }
    .app{ height:auto; display:block; }
    .body{ display:block; overflow:visible; }
    .viewport{ overflow:visible; padding:0; background:#fff; }
    .sizer{ width:auto !important; height:auto !important; overflow:visible !important; margin:0 !important; }
    .content{ position:static !important; transform:none !important; width:auto !important; }
    .paper{
      box-shadow:none; border:none; border-radius:0;
      padding:0; max-width:none;
      page-break-after:always;
    }
    .paper:last-child{ page-break-after:auto; }
    .page-badge{ display:none; }
  }
</style>
</head>

<body>
<div class="app">

  <!-- ================= 工具栏 ================= -->
  <header class="topbar">
    <div class="tb-left">
      <button class="btn" id="btnOpen" title="打开文件 (Ctrl+O)">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span class="btn-text">打开</span>
      </button>
      <button class="btn primary" id="btnImport" title="从本地导入 docx 文件"
              style="white-space:nowrap;padding:0 12px;font-size:12.5px;gap:5px">
        <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        <span>导入文件</span>
      </button>
      <button class="btn icon" id="btnToc" title="目录 (Ctrl+B)">
        <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      </button>
      <div class="doc-title" id="docTitle">未打开文件</div>
    </div>

    <div class="tb-right">
      <button class="btn icon" id="btnSearch" title="搜索 (Ctrl+F)">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      </button>
      <span class="sep"></span>
      <button class="btn icon" id="btnZoomOut" title="缩小 (Ctrl+-)">
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
      </button>
      <button class="btn zoom-label" id="btnZoom" title="重置为 100%">100%</button>
      <button class="btn icon" id="btnZoomIn" title="放大 (Ctrl++)">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="btn icon" id="btnFit" title="适应宽度">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <span class="sep"></span>
      <button class="btn icon" id="btnPan" title="拖动平移（按住空格临时启用）">
        <svg viewBox="0 0 24 24"><path d="M9 11V6.5a1.5 1.5 0 0 1 3 0V11m0-1.5V5a1.5 1.5 0 0 1 3 0v6m0-2.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.2a5 5 0 0 1-5-4.2l-.6-3.6a1.5 1.5 0 0 1 2.9-.8L9 13"/></svg>
      </button>
      <button class="btn icon" id="btnView" title="切换 连续 / 分页 视图">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="11" height="17" rx="1.5"/><path d="M18.5 6.5v14h-8"/></svg>
      </button>
      <button class="btn icon" id="btnTheme" title="深色 / 浅色">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="btn icon" id="btnFull" title="全屏">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M16 21h3a2 2 0 0 0 2-2v-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
      </button>
      <button class="btn icon" id="btnPrint" title="打印">
        <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7" rx="1"/></svg>
      </button>
      <button class="btn icon" id="btnExport" title="导出为 HTML">
        <svg viewBox="0 0 24 24"><path d="M12 3v12M7.5 10.5L12 15l4.5-4.5M4 21h16"/></svg>
      </button>
    </div>

    <div class="progress"><i id="progressBar"></i></div>
  </header>

  <!-- ================= 搜索栏 ================= -->
  <div class="searchbar" id="searchbar" hidden>
    <svg style="width:16px;height:16px;color:var(--muted);flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round"
         viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>

  </div>

  <!-- ================= 主体 ================= -->
  <div class="body">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <div class="sidebar-head">
          <span>文档目录</span>
          <button class="btn icon" id="btnCloseToc" title="收起">✕</button>
        </div>
        <nav class="toc" id="toc"></nav>
      </div>
    </aside>
    <div class="sidebar-mask" id="sidebarMask"></div>

    <div class="viewport" id="viewport">
      <div class="empty" id="empty">
        <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="选择 docx 文件">
          <svg class="dz-icon" width="46" height="46" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <path d="M14 2v6h6"/>
            <path d="M12 18v-6"/>
            <path d="M9 15l3-3 3 3"/>
          </svg>
          <p class="dz-title">点击选择 .docx 文件</p>
          <button class="btn primary" id="btnImportEmpty"
                  style="margin-top:6px;padding:0 18px;height:36px;font-size:13px">
            导入文件
          </button>
          <p class="dz-sub">
            也可以把文件拖拽到页面中，或按 Ctrl+V 粘贴<br>
            文件仅在本地浏览器解析，不会上传到任何服务器
          </p>
          <p class="dz-sub" id="diagText" style="font-size:11.5px;opacity:.7;margin-top:6px"></p>
        </div>
      </div>

      <div class="sizer" id="sizer" hidden>
        <div class="content" id="content"></div>
      </div>
    </div>

    <button class="to-top" id="btnTop" title="回到顶部">
      <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</div>

<input type="file" id="fileInput" hidden
       accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">

<div class="drag-overlay" id="dragOverlay"><div>松开鼠标以打开文件</div></div>

<div class="loading" id="loading" hidden>
  <div class="spinner"></div>
  <span>正在解析文档…</span>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
   * 状态
   * ========================================================== */
  var MIN_SCALE = 0.25;
  var MAX_SCALE = 4;
  var BASE_PAPER_WIDTH = 820;

  var state = {
    hasDoc: false,
    fileName: '',
    html: '',
    docWidth: 800,
    scale: 1,
    mode: 'continuous',   // 'continuous' | 'paged'
    pages: [],
    currentPage: 1,
    panMode: false,
    query: '',
    matches: [],
    matchIndex: -1
  };

  var spaceDown = false;

  /* ============================================================
   * 元素引用
   * ========================================================== */
  var $ = function (id) { return document.getElementById(id); };

  var els = {
    fileInput: $('fileInput'),
    dropzone: $('dropzone'),
    empty: $('empty'),
    viewport: $('viewport'),
    sizer: $('sizer'),
    content: $('content'),
    docTitle: $('docTitle'),
    diagText: $('diagText'),
    sidebar: $('sidebar'),
    sidebarMask: $('sidebarMask'),
    toc: $('toc'),
    searchbar: $('searchbar'),
    searchInput: $('searchInput'),
    searchCount: $('searchCount'),
    pager: $('pager'),
    pageInput: $('pageInput'),
    pageTotal: $('pageTotal'),
    progressBar: $('progressBar'),
    btnTop: $('btnTop'),
    toast: $('toast'),
    loading: $('loading'),
    dragOverlay: $('dragOverlay'),
    btnOpen: $('btnOpen'),
    btnToc: $('btnToc'),
    btnCloseToc: $('btnCloseToc'),
    btnSearch: $('btnSearch'),
    btnCloseSearch: $('btnCloseSearch'),
    btnPrevMatch: $('btnPrevMatch'),
    btnNextMatch: $('btnNextMatch'),
    btnZoomIn: $('btnZoomIn'),
    btnZoomOut: $('btnZoomOut'),
    btnZoom: $('btnZoom'),
    btnFit: $('btnFit'),
    btnPan: $('btnPan'),
    btnView: $('btnView'),
    btnTheme: $('btnTheme'),
    btnFull: $('btnFull'),
    btnPrint: $('btnPrint'),
    btnExport: $('btnExport'),
    btnPrevPage: $('btnPrevPage'),
    btnNextPage: $('btnNextPage')
  };

  /* ============================================================
   * 小工具
   * ========================================================== */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function debounce(fn, wait) {
    var t = null;
    return function () {
      var ctx = this, args = arguments;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(ctx, args); }, wait);
    };
  }

  var toastTimer = null;
  function toast(msg, ms) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      els.toast.classList.remove('show');
    }, ms || 2800);
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  }

  function readFileBuffer(file) {
    if (file.arrayBuffer) return file.arrayBuffer();
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(fr.result); };
      fr.onerror = function () { reject(fr.error || new Error('文件读取失败')); };
      fr.readAsArrayBuffer(file);
    });
  }

  function download(filename, content, mime) {
    var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  /* ============================================================
   * 主题
   * ========================================================== */
  function loadTheme() {
    var saved = null;
    try { saved = localStorage.getItem('docx-viewer-theme'); } catch (e) {}
    if (saved === 'dark') {
      document.body.classList.add('dark');
    } else if (!saved && window.matchMedia &&
               window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.body.classList.add('dark');
    }
    updateButtons();
  }

  function toggleTheme() {
    var dark = document.body.classList.toggle('dark');
    try { localStorage.setItem('docx-viewer-theme', dark ? 'dark' : 'light'); } catch (e) {}
    updateButtons();
  }

  /* ============================================================
   * 尺寸 / 缩放
   * ========================================================== */
  function computeDocWidth() {
    var avail = els.viewport.clientWidth - 32;
    return Math.max(260, Math.min(BASE_PAPER_WIDTH, avail));
  }

  function applyScale(next, anchor) {
    var s = clamp(next, MIN_SCALE, MAX_SCALE);
    var prev = state.scale || 1;
    var point = null;

    if (anchor) {
      var r0 = els.content.getBoundingClientRect();
      point = {
        x: (anchor.x - r0.left) / prev,
        y: (anchor.y - r0.top) / prev,
        ax: anchor.x,
        ay: anchor.y
      };
    }

    state.scale = s;
    els.content.style.transform = 'scale(' + s + ')';

    var contentHeight = els.content.offsetHeight || els.content.scrollHeight || 0;
    // 首次布局尚未完成时高度可能为 0，先给一个可见高度，避免整页空白
    if (state.hasDoc && contentHeight <= 0) {
      contentHeight = Math.max(els.viewport.clientHeight || 0, 320);
    }
    els.sizer.style.width = (state.docWidth * s) + 'px';
    els.sizer.style.height = (contentHeight * s) + 'px';
    els.btnZoom.textContent = Math.round(s * 100) + '%';

    if (point) {
      var r1 = els.content.getBoundingClientRect();
      var nx = r1.left + point.x * s;
      var ny = r1.top + point.y * s;
      els.viewport.scrollLeft += nx - point.ax;
      els.viewport.scrollTop += ny - point.ay;
    }

    onScroll();
  }

  function zoomBy(factor) {
    var r = els.viewport.getBoundingClientRect();
    applyScale(state.scale * factor, {
      x: r.left + r.width / 2,
      y: r.top + r.height / 2
    });
  }

  function fitWidth() {
    var avail = els.viewport.clientWidth - 32;
    if (!state.docWidth) return;
    applyScale(avail / state.docWidth);
  }

  /* ============================================================
   * 滚动 / 进度 / 页码
   * ========================================================== */
  var scrollRaf = null;

  function onScroll() {
    if (scrollRaf) return;
    scrollRaf = requestAnimationFrame(function () {
      scrollRaf = null;
      var v = els.viewport;
      var max = v.scrollHeight - v.clientHeight;
      var p = max > 0 ? v.scrollTop / max : 0;
      els.progressBar.style.width = (p * 100) + '%';
      els.btnTop.classList.toggle('show', v.scrollTop > 300);
      if (state.mode === 'paged') updateCurrentPage();
    });
  }

  function updateCurrentPage() {
    if (!state.pages.length) return;
    var v = els.viewport;
    var line = v.scrollTop + v.clientHeight * 0.35;
    var idx = 1;
    for (var i = 0; i < state.pages.length; i++) {
      var top = state.pages[i].offsetTop * state.scale;
      if (top <= line) idx = i + 1;
      else break;
    }
    state.currentPage = idx;
    if (document.activeElement !== els.pageInput) els.pageInput.value = idx;
    els.btnPrevPage.disabled = idx <= 1;
    els.btnNextPage.disabled = idx >= state.pages.length;
  }

  function goToPage(n) {
    var total = state.pages.length;
    if (!total) return;
    n = Math.max(1, Math.min(total, parseInt(n, 10) || 1));
    var page = state.pages[n - 1];
    var top = page.offsetTop * state.scale;
    els.viewport.scrollTo({ top: Math.max(0, top - 12), behavior: 'smooth' });
  }

  /* ============================================================
   * 滚动到元素
   * ========================================================== */
  function scrollToEl(el, offset) {
    if (!el) return;
    var vRect = els.viewport.getBoundingClientRect();
    var r = el.getBoundingClientRect();
    var top = els.viewport.scrollTop + (r.top - vRect.top) - (offset == null ? 16 : offset);
    els.viewport.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }

  /* ============================================================
   * 文档处理
   * ========================================================== */
  function buildMammothOptions() {
    var options = {
      styleMap: [
        "p[style-name='Title'] => h1.doc-title:fresh",
        "p[style-name='Subtitle'] => p.doc-subtitle:fresh",
        "p[style-name='Heading 1'] => h1:fresh",
        "p[style-name='Heading 2'] => h2:fresh",
        "p[style-name='Heading 3'] => h3:fresh",
        "p[style-name='Heading 4'] => h4:fresh",
        "p[style-name='标题'] => h1:fresh",
        "p[style-name='标题 1'] => h1:fresh",
        "p[style-name='标题 2'] => h2:fresh",
        "p[style-name='标题 3'] => h3:fresh",
        "p[style-name='标题 4'] => h4:fresh"
      ]
    };
    if (window.mammoth && window.mammoth.images) {
      options.convertImage = window.mammoth.images.imgElement(function (image) {
        return image.read('base64').then(function (data) {
          return { src: 'data:' + image.contentType + ';base64,' + data };
        });
      });
    }
    return options;
  }

  function postProcess(root) {
    var tables = root.querySelectorAll('table');
    Array.prototype.forEach.call(tables, function (t) {
      if (t.parentNode && t.parentNode.classList &&
          t.parentNode.classList.contains('table-wrap')) return;
      var wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    });

    var links = root.querySelectorAll('a');
    Array.prototype.forEach.call(links, function (a) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    });
  }

  /* ---------- 连续视图 ---------- */
  function buildContinuousView() {
    els.content.innerHTML = '';
    var paper = document.createElement('article');
    paper.className = 'paper docx';
    paper.innerHTML = state.html;
    postProcess(paper);

    if (!paper.textContent.trim() && !paper.querySelector('img, table')) {
      var p = document.createElement('p');
      p.style.color = 'var(--muted)';
      p.textContent = '（这个文档里没有可显示的内容）';
      paper.appendChild(p);
    }

    els.content.appendChild(paper);
    state.pages = [];
  }

  /* ---------- 分页视图 ---------- */
  function buildPagedView() {
    els.content.innerHTML = '';

    var tmp = document.createElement('article');
    tmp.className = 'paper docx';
    tmp.innerHTML = state.html;
    postProcess(tmp);

    var nodes = Array.prototype.slice.call(tmp.childNodes);

    var hasH1 = nodes.some(function (n) { return n.nodeType === 1 && n.tagName === 'H1'; });
    var hasH2 = nodes.some(function (n) { return n.nodeType === 1 && n.tagName === 'H2'; });
    var splitTag = hasH1 ? 'H1' : (hasH2 ? 'H2' : null);

    var groups = [];
    var cur = [];

    nodes.forEach(function (n) {
      if (splitTag && n.nodeType === 1 && n.tagName === splitTag && cur.length) {
        groups.push(cur);
        cur = [];
      }
      cur.push(n);
    });
    if (cur.length) groups.push(cur);
    if (!groups.length) groups.push([]);

    state.pages = groups.map(function (group, i) {
      var page = document.createElement('article');
      page.className = 'paper docx page';

      group.forEach(function (n) { page.appendChild(n); });

      if (!page.textContent.trim() && !page.querySelector('img, table')) {
        var p = document.createElement('p');
        p.style.color = 'var(--muted)';
        p.textContent = '（空白页）';
        page.appendChild(p);
      }

      var badge = document.createElement('div');
      badge.className = 'page-badge';
      badge.textContent = '第 ' + (i + 1) + ' 页 / 共 ' + groups.length + ' 页';
      page.appendChild(badge);

      els.content.appendChild(page);
      return page;
    });

    els.pageTotal.textContent = groups.length;
    els.pageInput.max = groups.length;
    els.pageInput.value = 1;
    state.currentPage = 1;
  }

  /* ---------- 统一渲染 ---------- */
  function renderView() {
    if (!state.hasDoc) return;

    if (state.mode === 'paged') {
      buildPagedView();
    } else {
      buildContinuousView();
    }

    buildOutline();
    applyScale(state.scale);

    if (state.query) {
      doSearch(state.query, true);
    }

    updateButtons();
    onScroll();
  }

  /* ---------- 大纲 ---------- */
  function buildOutline() {
    var heads = els.content.querySelectorAll('h1, h2, h3, h4');
    els.toc.innerHTML = '';

    if (!heads.length) {
      var tip = document.createElement('p');
      tip.className = 'toc-empty';
      tip.textContent = '文档中没有可导航的标题';
      els.toc.appendChild(tip);
      return;
    }

    Array.prototype.forEach.call(heads, function (h, i) {
      if (!h.id) h.id = 'docx-heading-' + i;

      var level = parseInt(h.tagName.slice(1), 10) || 1;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'toc-item lv' + Math.min(level, 4);
      btn.textContent = (h.textContent || '').trim() || '（无标题）';
      btn.title = btn.textContent;

      btn.addEventListener('click', function () {
        scrollToEl(h, 16);
        if (window.innerWidth <= 820) closeToc();
      });

      els.toc.appendChild(btn);
    });
  }

  /* ============================================================
   * 搜索
   * ========================================================== */
  function clearHighlights() {
    var marks = els.content.querySelectorAll('mark.hl');
    Array.prototype.forEach.call(marks, function (m) {
      var parent = m.parentNode;
      if (!parent) return;
      parent.replaceChild(document.createTextNode(m.textContent), m);
      parent.normalize();
    });
    state.matches = [];
    state.matchIndex = -1;
  }

  function doSearch(q, silent) {
    clearHighlights();

    state.query = q || '';
    els.searchCount.textContent = '';

    if (!q || !state.hasDoc) return;

    var ql = q.toLowerCase();

    var walker = document.createTreeWalker(
      els.content,
      NodeFilter.SHOW_TEXT,
      {
        acceptNode: function (node) {
          if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          var pe = node.parentElement;
          if (!pe) return NodeFilter.FILTER_REJECT;
          var tag = pe.tagName;
          if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'MARK') return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      }
    );

    var textNodes = [];
    while (walker.nextNode()) textNodes.push(walker.currentNode);

    var matches = [];

    textNodes.forEach(function (node) {
      var val = node.nodeValue;
      var lv = val.toLowerCase();
      var idx = lv.indexOf(ql);
      if (idx === -1) return;

      var frag = document.createDocumentFragment();
      var last = 0;

      while (idx !== -1) {
        if (idx > last) frag.appendChild(document.createTextNode(val.slice(last, idx)));

        var mark = document.createElement('mark');
        mark.className = 'hl';
        mark.textContent = val.slice(idx, idx + q.length);
        frag.appendChild(mark);
        matches.push(mark);

        last = idx + q.length;
        idx = lv.indexOf(ql, last);
      }

      if (last < val.length) frag.appendChild(document.createTextNode(val.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });

    state.matches = matches;

    if (!matches.length) {
      els.searchCount.textContent = '无结果';
      return;
    }

    els.searchCount.textContent = '0/' + matches.length;

    if (!silent) {
      nextMatch(1);
    } else {
      els.searchCount.textContent = matches.length + ' 处';
    }
  }

  function nextMatch(dir) {
    if (!state.matches.length) return;

    state.matchIndex =
      (state.matchIndex + dir + state.matches.length) % state.matches.length;

    state.matches.forEach(function (m, i) {
      m.classList.toggle('current', i === state.matchIndex);
    });

    var m = state.matches[state.matchIndex];
    scrollToEl(m, els.viewport.clientHeight / 2);
    els.searchCount.textContent = (state.matchIndex + 1) + '/' + state.matches.length;
  }

  /* ============================================================
   * 打开文件
   * ========================================================== */
  function pickFile() {
    els.fileInput.value = '';
    els.fileInput.click();
  }

  function showLoading(show) {
    els.loading.hidden = !show;
  }

  function setDiag(text) {
    if (els.diagText) els.diagText.textContent = text || '';
  }

  /* 空状态里显示关键链路状态，便于区分“数据没传进来”还是“渲染问题” */
  function refreshDiag(extra) {
    var parts = [];
    parts.push('解析库: ' + (window.mammoth ? '已加载' : '未加载'));
    parts.push('文件桥: ' + (window.FreeFileDocx ? '已注入' : '未注入'));
    try {
      var q = new URLSearchParams(location.search);
      parts.push('自动加载: ' + (q.get('src') ? '是' : '否'));
    } catch (e) {
      parts.push('自动加载: 否');
    }
    if (extra) parts.push(extra);
    parts.push('页面 v3');
    setDiag(parts.join(' · '));
  }

  function openFile(file) {
    if (!file) return;

    if (/\.doc$/i.test(file.name) && !/\.docx$/i.test(file.name)) {
      toast('不支持旧版 .doc 格式，请先用 Word 另存为 .docx');
      return;
    }
    if (!/\.docx$/i.test(file.name)) {
      toast('请选择 .docx 格式的文件');
      return;
    }

    showLoading(true);

    readFileBuffer(file)
      .then(function (buffer) {
        return openBuffer(buffer, file.name, file.size);
      })
      .then(function () { showLoading(false); },
            function () { showLoading(false); });
  }

  /* 统一解析入口：本地选择 / 由浏览器 URL 获取的二进制都走这里 */
  function openBuffer(buffer, name, size) {
    if (!window.mammoth) {
      refreshDiag('解析库未加载');
      toast('解析库加载失败，请重新打开页面', 4000);
      return Promise.reject(new Error('mammoth missing'));
    }

    console.log('[docx-viewer] convert bytes=' + (buffer ? (buffer.byteLength || 0) : 0));
    refreshDiag('解析中…');

    return new Promise(function (resolve) {
      setTimeout(function () { resolve(buffer); }, 30);
    })
      .then(function (buf) {
        return window.mammoth.convertToHtml({ arrayBuffer: buf }, buildMammothOptions());
      })
      .then(function (result) {
        console.log('[docx-viewer] converted html length=' + ((result && result.value || '').length));
        applyDocument(result, name || 'document.docx', size || 0);
      })
      .catch(function (err) {
        console.error(err);
        refreshDiag('解析失败：' + ((err && err.message) || err));
        toast('解析失败：文件可能已损坏或不是有效的 .docx 文件', 4000);
      });
  }

  function applyDocument(result, name, size) {
    state.html = result.value || '';
    state.fileName = name;
    state.hasDoc = true;
    state.mode = 'continuous';
    state.query = '';
    state.scale = 1;

    els.searchInput.value = '';
    els.searchCount.textContent = '';
    els.empty.hidden = true;
    els.sizer.hidden = false;

    els.docTitle.textContent = size ? (name + ' · ' + formatSize(size)) : name;
    els.docTitle.title = name;
    document.title = name + ' · DOCX 查看器';

    state.docWidth = computeDocWidth();
    els.content.style.width = state.docWidth + 'px';

    renderView();
    els.viewport.scrollTop = 0;

    if (!state.html || !state.html.trim()) {
      refreshDiag('已解析，但内容为空');
      toast('文档已解析，但没有可显示的内容', 4000);
    } else {
      refreshDiag('已解析 ' + state.html.length + ' 字符');
    }

    // 自动打开时 WebView 可能尚未完成首次布局，下一帧再校正一次尺寸
    requestAnimationFrame(function () {
      if (state.hasDoc) applyScale(state.scale);
    });

    if (result.messages && result.messages.length) {
      console.warn('[mammoth] 转换提示：', result.messages);
    }
  }

  /* 浏览器可通过 ?src= 打开指定文档；Android 端优先走 Kotlin 文件桥 */
  function loadFromQuery() {
    var params;
    try { params = new URLSearchParams(window.location.search); } catch (e) { return; }
    var src = params.get('src');
    if (!src) return;

    var name = params.get('name') || 'document.docx';
    var size = parseInt(params.get('size') || '0', 10) || 0;

    console.log('[docx-viewer] loadFromQuery src=' + src + ' name=' + name + ' size=' + size);
    refreshDiag('自动加载中…');

    if (window.FreeFileDocx) {
      loadFromBridge(name, size);
    } else {
      loadByXhr(src, name, size);
    }
  }

  /* Kotlin 文件桥：分块读取，避免 file:// 无法 fetch、也不受传输长度限制 */
  function loadFromBridge(name, size) {
    showLoading(true);
    setTimeout(function () {
      try {
        var total = Number(window.FreeFileDocx.size()) || 0;
        console.log('[docx-viewer] bridge bytes=' + total);
        if (!total) {
          showLoading(false);
          refreshDiag('读取失败：文件为空');
          toast('文档内容为空，无法解析', 5000);
          return;
        }
        var CHUNK = 256 * 1024;
        var bytes = new Uint8Array(total);
        var offset = 0;
        while (offset < total) {
          var len = Math.min(CHUNK, total - offset);
          var b64 = window.FreeFileDocx.readBase64(offset, len);
          if (!b64) throw new Error('读取失败：offset ' + offset);
          var bin = atob(b64);
          if (!bin.length) throw new Error('读取失败：offset ' + offset);
          for (var i = 0; i < bin.length; i++) bytes[offset + i] = bin.charCodeAt(i);
          offset += bin.length;
        }
        openBuffer(bytes.buffer, name, size)
          .then(function () { showLoading(false); },
                function () { showLoading(false); });
      } catch (err) {
        console.error(err);
        showLoading(false);
        refreshDiag('读取失败：' + ((err && err.message) || err));
        toast('无法读取文档：' + ((err && err.message) || err), 5000);
      }
    }, 0);
  }

  /* 桌面浏览器兜底：直接 XHR 读取传入的地址 */
  function loadByXhr(src, name, size) {
    showLoading(true);
    var xhr = new XMLHttpRequest();
    xhr.open('GET', src, true);
    xhr.responseType = 'arraybuffer';
    xhr.onload = function () {
      if (xhr.status && (xhr.status < 200 || xhr.status >= 300)) {
        showLoading(false);
        refreshDiag('读取失败：HTTP ' + xhr.status);
        toast('无法读取文档（HTTP ' + xhr.status + '）', 5000);
        return;
      }
      var buffer = xhr.response;
      if (!buffer || !buffer.byteLength) {
        showLoading(false);
        refreshDiag('读取失败：内容为空');
        toast('文档内容为空，无法解析', 5000);
        return;
      }
      openBuffer(buffer, name, size)
        .then(function () { showLoading(false); },
              function () { showLoading(false); });
    };
    xhr.onerror = function () {
      showLoading(false);
      refreshDiag('读取失败：XHR 无法访问 src');
      toast('无法读取文档文件，请点击下方按钮手动选择', 5000);
    };
    xhr.send();
  }

  /* ============================================================
   * 导出 HTML
   * ========================================================== */
  function exportHtml() {
    if (!state.hasDoc) {
      toast('请先打开一个文档');
      return;
    }

    var css = [
      'body{margin:0;padding:32px 16px;background:#f5f6f8;color:#1f2328;',
      'font:16px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}',
      '.docx{max-width:820px;margin:0 auto;background:#fff;padding:44px 48px;border-radius:8px;',
      'box-shadow:0 2px 10px rgba(0,0,0,.06);overflow-wrap:break-word;}',
      '.docx h1,.docx h2,.docx h3,.docx h4{font-weight:600;line-height:1.35;margin:1.4em 0 .6em;}',
      '.docx h1{font-size:1.7em}.docx h2{font-size:1.4em}.docx h3{font-size:1.2em}.docx h4{font-size:1.05em}',
      '.docx p{margin:0 0 .9em}.docx ul,.docx ol{margin:0 0 .9em;padding-left:1.6em}',
      '.docx img{max-width:100%;height:auto}.docx a{color:#2563eb}',
      '.docx table{border-collapse:collapse;width:100%;font-size:.95em}',
      '.docx th,.docx td{border:1px solid #d8dee6;padding:7px 10px;text-align:left;vertical-align:top}',
      '.docx th{background:#f6f8fa;font-weight:600}',
      '.docx blockquote{margin:0 0 1em;padding:.2em 1em;border-left:4px solid #d8dee6;color:#57606a}',
      '.docx code{background:#f2f4f7;padding:.15em .4em;border-radius:5px;font-size:.9em}',
      '.docx pre{background:#f6f8fa;padding:12px 14px;border-radius:8px;overflow:auto}',
      '.docx .table-wrap{max-width:100%;overflow-x:auto;margin:0 0 1em}',
      '@media print{body{background:#fff;padding:0}.docx{box-shadow:none;border-radius:0;max-width:none;padding:0}}'
    ].join('');

    var title = escapeHtml(state.fileName || '文档');
    var html =
      '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>' + title + '</title>\n<style>' + css + '</style>\n</head>\n<body>\n' +
      '<div class="docx">' + state.html + '</div>\n</body>\n</html>';

    var name = (state.fileName || 'document').replace(/\.docx$/i, '') + '.html';
    download(name, html, 'text/html;charset=utf-8');
    toast('已导出 HTML 文件');
  }

  /* ============================================================
   * 侧边栏
   * ========================================================== */
  function openToc() {
    els.sidebar.classList.add('open');
    els.btnToc.classList.add('active');
    if (window.innerWidth <= 820) els.sidebarMask.classList.add('show');
  }

  function closeToc() {
    els.sidebar.classList.remove('open');
    els.btnToc.classList.remove('active');
    els.sidebarMask.classList.remove('show');
  }

  function toggleToc() {
    if (els.sidebar.classList.contains('open')) closeToc();
    else openToc();
  }

  /* ============================================================
   * 搜索栏
   * ========================================================== */
  function openSearch() {
    if (!state.hasDoc) {
      toast('请先打开一个文档');
      return;
    }
    els.searchbar.hidden = false;
    els.btnSearch.classList.add('active');
    setTimeout(function () { els.searchInput.focus(); }, 30);
    if (els.searchInput.value) {
      doSearch(els.searchInput.value);
    }
  }

  function closeSearch() {
    els.searchbar.hidden = true;
    els.btnSearch.classList.remove('active');
    els.searchInput.value = '';
    clearHighlights();
    state.query = '';
    els.searchCount.textContent = '';
    els.viewport.focus({ preventScroll: true });
  }

  /* ============================================================
   * 按钮状态
   * ========================================================== */
  function updateButtons() {
    els.btnView.classList.toggle('active', state.mode === 'paged');
    els.btnPan.classList.toggle('active', state.panMode);
    els.btnTheme.classList.toggle('active', document.body.classList.contains('dark'));
    els.btnToc.classList.toggle('active', els.sidebar.classList.contains('open'));
    els.pager.hidden = !(state.hasDoc && state.mode === 'paged');

    if (!state.hasDoc) {
      els.btnSearch.disabled = true;
      els.btnPrint.disabled = true;
      els.btnExport.disabled = true;
      els.btnView.disabled = true;
      els.btnPan.disabled = true;
      els.btnFit.disabled = true;
      els.btnZoomIn.disabled = true;
      els.btnZoomOut.disabled = true;
    } else {
      els.btnSearch.disabled = false;
      els.btnPrint.disabled = false;
      els.btnExport.disabled = false;
      els.btnView.disabled = false;
      els.btnPan.disabled = false;
      els.btnFit.disabled = false;
      els.btnZoomIn.disabled = false;
      els.btnZoomOut.disabled = false;
    }
  }

  /* ============================================================
   * 平移（拖拽）
   * ========================================================== */
  var panning = false;
  var panStartX = 0, panStartY = 0;
  var panScrollLeft = 0, panScrollTop = 0;

  function panEnabled() {
    return state.panMode || spaceDown;
  }

  els.viewport.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'touch') return;
    if (e.button !== 0) return;
    if (!panEnabled() || !state.hasDoc) return;

    panning = true;
    panStartX = e.clientX;
    panStartY = e.clientY;
    panScrollLeft = els.viewport.scrollLeft;
    panScrollTop = els.viewport.scrollTop;

    document.body.classList.add('panning');
    try { els.viewport.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });

  els.viewport.addEventListener('pointermove', function (e) {
    if (!panning) return;
    els.viewport.scrollLeft = panScrollLeft - (e.clientX - panStartX);
    els.viewport.scrollTop = panScrollTop - (e.clientY - panStartY);
  });

  function endPan() {
    panning = false;
    document.body.classList.remove('panning');
  }

  els.viewport.addEventListener('pointerup', endPan);
  els.viewport.addEventListener('pointercancel', endPan);
  window.addEventListener('blur', endPan);

  /* ============================================================
   * 触摸双指缩放
   * ========================================================== */
  var pinch = null;

  function touchDistance(touches) {
    var dx = touches[0].clientX - touches[1].clientX;
    var dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function touchCenter(touches) {
    return {
      x: (touches[0].clientX + touches[1].clientX) / 2,
      y: (touches[0].clientY + touches[1].clientY) / 2
    };
  }

  els.viewport.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2 && state.hasDoc) {
      var c = touchCenter(e.touches);
      pinch = {
        dist: touchDistance(e.touches),
        scale: state.scale,
        cx: c.x,
        cy: c.y
      };
    }
  }, { passive: true });

  els.viewport.addEventListener('touchmove', function (e) {
    if (!pinch || e.touches.length !== 2) return;
    if (pinch.dist <= 0) return;

    e.preventDefault();

    var d = touchDistance(e.touches);
    var c = touchCenter(e.touches);
    var target = pinch.scale * (d / pinch.dist);
    applyScale(target, { x: c.x, y: c.y });
  }, { passive: false });

  els.viewport.addEventListener('touchend', function (e) {
    if (e.touches.length < 2) pinch = null;
  }, { passive: true });

  els.viewport.addEventListener('touchcancel', function () {
    pinch = null;
  }, { passive: true });

  /* ============================================================
   * 滚轮缩放（Ctrl / Alt + 滚轮）
   * ========================================================== */
  els.viewport.addEventListener('wheel', function (e) {
    if (!state.hasDoc) return;
    if (!(e.ctrlKey || e.metaKey || e.altKey)) return;

    e.preventDefault();

    var factor = Math.exp(-e.deltaY * 0.0018);
    applyScale(state.scale * factor, { x: e.clientX, y: e.clientY });
  }, { passive: false });

  /* ============================================================
   * 文件选择 / 拖拽 / 粘贴
   * ========================================================== */
  els.btnOpen.addEventListener('click', pickFile);
  $('btnImport').addEventListener('click', pickFile);
  $('btnImportEmpty').addEventListener('click', function (e) {
    // 阻止冒泡，避免触发外层 dropzone 的点击导致弹出两次选择器
    e.stopPropagation();
    pickFile();
  });
  els.dropzone.addEventListener('click', pickFile);
  els.dropzone.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      pickFile();
    }
  });

  els.fileInput.addEventListener('change', function () {
    var f = els.fileInput.files && els.fileInput.files[0];
    if (f) openFile(f);
  });

  var dragDepth = 0;

  function hasFiles(e) {
    var dt = e.dataTransfer;
    if (!dt || !dt.types) return false;
    return Array.prototype.indexOf.call(dt.types, 'Files') !== -1;
  }

  window.addEventListener('dragenter', function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth++;
    els.dragOverlay.classList.add('show');
  });

  window.addEventListener('dragover', function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'copy'; } catch (err) {}
  });

  window.addEventListener('dragleave', function (e) {
    if (!hasFiles(e)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) els.dragOverlay.classList.remove('show');
  });

  window.addEventListener('drop', function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0;
    els.dragOverlay.classList.remove('show');

    var f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) openFile(f);
  });

  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) { e.preventDefault(); });

  window.addEventListener('paste', function (e) {
    var items = e.clipboardData && e.clipboardData.files;
    if (items && items.length) {
      var f = items[0];
      if (/\.docx$/i.test(f.name)) {
        e.preventDefault();
        openFile(f);
      }
    }
  });

  /* ============================================================
   * 工具栏事件
   * ========================================================== */
  els.btnToc.addEventListener('click', toggleToc);
  els.btnCloseToc.addEventListener('click', closeToc);
  els.sidebarMask.addEventListener('click', closeToc);

  els.btnSearch.addEventListener('click', openSearch);
  els.btnCloseSearch.addEventListener('click', closeSearch);
  els.btnPrevMatch.addEventListener('click', function () { nextMatch(-1); });
  els.btnNextMatch.addEventListener('click', function () { nextMatch(1); });

  var searchDebounced = debounce(function () {
    doSearch(els.searchInput.value.trim());
  }, 280);

  els.searchInput.addEventListener('input', searchDebounced);
  els.searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (els.searchInput.value.trim() !== state.query) {
        doSearch(els.searchInput.value.trim());
      } else {
        nextMatch(e.shiftKey ? -1 : 1);
      }
    } else if (e.key === 'Escape') {
      closeSearch();
    }
  });

  els.btnZoomIn.addEventListener('click', function () { zoomBy(1.25); });
  els.btnZoomOut.addEventListener('click', function () { zoomBy(0.8); });
  els.btnZoom.addEventListener('click', function () { applyScale(1); });
  els.btnFit.addEventListener('click', fitWidth);

  els.btnPan.addEventListener('click', function () {
    state.panMode = !state.panMode;
    els.viewport.classList.toggle('pan-mode', state.panMode);
    updateButtons();
    toast(state.panMode ? '拖动平移已开启（按住空格可临时启用）' : '拖动平移已关闭');
  });

  els.btnView.addEventListener('click', function () {
    if (!state.hasDoc) return;
    state.mode = state.mode === 'continuous' ? 'paged' : 'continuous';
    els.viewport.scrollTop = 0;
    renderView();

    if (state.mode === 'paged') {
      if (state.pages.length <= 1) {
        toast('文档中没有可用的分页标题，只生成了 1 页', 3200);
      } else {
        toast('已切换为分页视图（共 ' + state.pages.length + ' 页）');
      }
    } else {
      toast('已切换为连续视图');
    }
  });

  els.btnTheme.addEventListener('click', toggleTheme);

  els.btnFull.addEventListener('click', function () {
    var doc = document;
    var el = doc.documentElement;

    if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else {
      if (doc.exitFullscreen) doc.exitFullscreen();
      else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
    }
  });

  els.btnPrint.addEventListener('click', function () {
    if (!state.hasDoc) return;
    window.print();
  });

  els.btnExport.addEventListener('click', exportHtml);

  els.btnTop.addEventListener('click', function () {
    els.viewport.scrollTo({ top: 0, behavior: 'smooth' });
  });

  els.btnPrevPage.addEventListener('click', function () {
    goToPage(state.currentPage - 1);
  });
  els.btnNextPage.addEventListener('click', function () {
    goToPage(state.currentPage + 1);
  });
  els.pageInput.addEventListener('change', function () {
    goToPage(els.pageInput.value);
  });
  els.pageInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      goToPage(els.pageInput.value);
      els.pageInput.blur();
    }
  });

  /* ============================================================
   * 滚动监听
   * ========================================================== */
  els.viewport.addEventListener('scroll', onScroll, { passive: true });

  /* ============================================================
   * 窗口尺寸变化
   * ========================================================== */
  var onResize = debounce(function () {
    if (!state.hasDoc) return;

    var w = computeDocWidth();
    if (w !== state.docWidth) {
      state.docWidth = w;
      els.content.style.width = w + 'px';
      applyScale(state.scale);
    } else {
      applyScale(state.scale);
    }

    if (window.innerWidth > 820) {
      els.sidebarMask.classList.remove('show');
    }
  }, 160);

  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () {
    setTimeout(onResize, 260);
  });

  /* ============================================================
   * 键盘快捷键
   * ========================================================== */
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    var isField = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    var mod = e.ctrlKey || e.metaKey;

    if (mod && e.key.toLowerCase() === 'o') {
      e.preventDefault();
      pickFile();
      return;
    }
    if (mod && e.key.toLowerCase() === 'f') {
      e.preventDefault();
      openSearch();
      return;
    }
    if (mod && e.key.toLowerCase() === 'b') {
      e.preventDefault();
      toggleToc();
      return;
    }
    if (mod && (e.key === '=' || e.key === '+')) {
      e.preventDefault();
      zoomBy(1.25);
      return;
    }
    if (mod && e.key === '-') {
      e.preventDefault();
      zoomBy(0.8);
      return;
    }
    if (mod && e.key === '0') {
      e.preventDefault();
      applyScale(1);
      return;
    }
    if (e.key === 'Escape') {
      closeSearch();
      closeToc();
      return;
    }

    if (isField) return;

    if (e.key === ' ') {
      if (t && t.tagName === 'BUTTON') return;
      if (!state.hasDoc) return;
      e.preventDefault();
      spaceDown = true;
      els.viewport.classList.add('pan-mode');
    }
  });

  document.addEventListener('keyup', function (e) {
    if (e.key === ' ') {
      spaceDown = false;
      els.viewport.classList.toggle('pan-mode', state.panMode);
    }
  });

  /* ============================================================
   * 初始化
   * ========================================================== */
  function init() {
    loadTheme();
    updateButtons();
    refreshDiag();
    console.log('[docx-viewer] init mammoth=' + !!window.mammoth +
      ' bridge=' + !!window.FreeFileDocx +
      ' search=' + location.search);

    if (!window.mammoth) {
      toast('解析库加载失败，请重新打开页面', 5000);
    }
    // 无论解析库是否就绪都尝试自动加载，openBuffer 内部会再校验
    loadFromQuery();
  }

  init();
})();
</script>
</body>
</html>
